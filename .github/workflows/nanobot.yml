name: AgentDock Nanobot

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, feat/nanobot-integration, feat/private-instances-governance]

permissions:
  contents: read

jobs:
  adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e 'packages/agentcore[dev]' -e 'services/shim[dev]' -e 'services/control_plane[dev]'
      - run: mypy packages/agentcore/agentcore
      - name: Driver and protocol contracts
        run: |
          PYTHONPATH=packages/agentcore pytest -q packages/agentcore/tests/drivers/test_nanobot.py packages/agentcore/tests/drivers/conformance/test_meta.py
          PYTHONPATH=packages/agentcore pytest -q packages/agentcore/tests/drivers/conformance/test_conformance.py -k nanobot
      - name: Complete control plane unit suite
        run: |
          PYTHONPATH=services/control_plane:services/control_plane/tests pytest -q -m unit services/control_plane/tests
      - name: Shim driver registration
        run: PYTHONPATH=services/shim pytest -q services/shim/tests/test_main_drivers.py

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/console/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx vitest run src/components/ChatTimeline.test.tsx src/components/EventFeed.test.tsx src/lib/drivers.test.ts
      - run: npm run build

  gateway-image:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the actual runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/agent/Dockerfile
          load: true
          tags: agentdock-agent:test
          build-args: VARIANT=slim
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Default Shim entrypoint under production security limits
        run: python scripts/test_agent_image.py --image agentdock-agent:test
      - name: Real gateway streaming and restart persistence with privilege drop
        run: |
          docker run --rm --user root \
            -e AGENTDOCK_TEST_NANOBOT=1 \
            -v "$PWD/packages/agentcore/tests/drivers/test_nanobot_live.py:/tests/test_nanobot_live.py:ro" \
            --entrypoint /bin/bash agentdock-agent:test -ec '
              /opt/venv/bin/python -m ensurepip
              /opt/venv/bin/python -m pip install pytest pytest-asyncio
              /opt/venv/bin/python -m pytest -q -o asyncio_mode=auto /tests/test_nanobot_live.py
            '
      - name: Three isolated gateways, pause/resume and volume recreation
        run: python scripts/test_nanobot_instances.py --image agentdock-agent:test

  governance-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agentdock
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: agentdock_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentdock -d agentdock_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://agentdock:test-only@localhost:5432/agentdock_test
      AGENTDOCK_TEST_DATABASE_URL: postgresql+asyncpg://agentdock:test-only@localhost:5432/agentdock_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e 'packages/agentcore[dev]' -e 'services/control_plane[dev]'
      - name: Upgrade the real migration chain
        working-directory: services/control_plane
        run: alembic upgrade head
      - name: User isolation, workflow targets and concurrent budget reservations
        run: PYTHONPATH=services/control_plane:services/control_plane/tests pytest -q services/control_plane/tests/test_private_instances.py services/control_plane/tests/test_audit_view.py

  backup-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y age
      - run: docker pull alpine:3.21 && docker pull postgres:16
      - run: python scripts/test_backup.py
