name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, feat/private-instances-governance]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install all service test dependencies
        run: pip install -e 'packages/agentcore[dev]' -e 'services/shim[dev]' -e 'services/control_plane[dev]' -e 'services/connectors[dev]'
      - run: ruff check .
      - run: mypy packages/agentcore/agentcore
      - name: Unit suites (separate test namespaces)
        run: |
          PYTHONPATH=packages/agentcore pytest -m unit -q packages/agentcore/tests
          PYTHONPATH=services/control_plane:services/control_plane/tests pytest -m unit -q services/control_plane/tests
          PYTHONPATH=services/shim pytest -m unit -q services/shim/tests
          PYTHONPATH=services/connectors pytest -m unit -q services/connectors/tests

  web-console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/console/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Operations desktop and mobile browser checks
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --config playwright.operations.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operations-browser-results
          path: web/console/test-results/

  integration:
    # Broader legacy service integration is still available on manual runs.
    # Automatic Nanobot/Postgres/backup integration lives in nanobot.yml.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e 'packages/agentcore[dev]' -e 'services/shim[dev]' -e 'services/control_plane[dev]' -e 'services/connectors[dev]'
      - run: docker compose -f deploy/docker-compose.test.yml config -q
      - run: docker compose -f deploy/docker-compose.test.yml up -d --wait
      - name: Legacy integration suites
        env:
          REQUIRE_DOCKER: "1"
        run: |
          PYTHONPATH=packages/agentcore pytest -m integration -q packages/agentcore/tests
          PYTHONPATH=services/control_plane:services/control_plane/tests pytest -m integration -q services/control_plane/tests
          PYTHONPATH=services/shim pytest -m integration -q services/shim/tests
          PYTHONPATH=services/connectors pytest -m integration -q services/connectors/tests
      - if: always()
        run: docker compose -f deploy/docker-compose.test.yml down -v
