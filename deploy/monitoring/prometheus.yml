# Mount /run/secrets/agentdock_monitor_token with the staff bootstrap token.
# Restrict access to this file and expose Prometheus only to operators.
global:
  scrape_interval: 30s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: agentdock
    metrics_path: /v1/operations/metrics
    authorization:
      credentials_file: /run/secrets/agentdock_monitor_token
    static_configs:
      - targets: [control-plane:8443]
